plugins {
  id 'com.android.library'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"
apply from: "${rootProject.rootDir}/groovy/publishing.gradle"

android {
  namespace = 'com.universalmaps.app.sdk.widgets.speedlimit'
  enableKotlin = true
  resourcePrefix = 'om_widget_'
  testOptions.unitTests.includeAndroidResources = true
}

dependencies {
  implementation libs.androidx.annotation
  implementation libs.androidx.core

  testImplementation libs.androidx.junit
  testImplementation libs.mockito.core
  testImplementation libs.robolectric
}

Publish(project, [
    'name'       : 'Universal Maps SDK. SpeedLimit widget',
    'description': 'A library that provides a speed limit widget for the Universal Maps SDK'
])
