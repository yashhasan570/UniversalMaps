plugins {
  id 'com.android.library'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"
apply from: "${rootProject.rootDir}/groovy/publishing.gradle"

android {
  namespace = 'com.universalmaps.app.sdk.maps.world'
  // enableKotlin = true  // see app/build.gradle
}

Publish(project, [
    'name'       : 'Universal Maps SDK. World Maps',
    'description': 'A library that provides world maps for the Universal Maps SDK'
])
